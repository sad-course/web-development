<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Masks </title>
    <link rel="stylesheet" href="assets/styles/style.css">

<body>
    <div class="navbar">
        <span id="openMenuBtn">
            <img src="assets/images/menu.svg" alt="">
        </span>
        <div class="navbar-items" style="display: none;">
            <a href="/">Início</a>
            <a href="/index.html">Lista de Compras</a>
            <a href="/images_expanded.html">Imagens Expandidas</a>
            <a href="/mask_inputs.html">Máscaras de Inputs</a>
        </div>
        
    </div>


    <main>
        <div id="container" style="width: 400px;">
            <form action="" class="" style="display: flex; flex-direction: column; gap: 30px;">
                <div>
                    <label for="">Nome:</label>
                    <input type="text" id="nameInput">
                </div>
                <div>
                    <label for="">CPF:</label>
                    <input type="text" id="cpfInput" maxlength="14">
                </div>
                <div>
                    <label for="">Email:</label>
                    <input type="email" id="emailInput">
                </div>
                <div>
                    <label for="">Telefone:</label>
                    <input type="text" name="" id="phoneInput" maxlength="14">
                </div>
                <button type="reset" onclick="validateInputs()">Validar</button>
            </form>
        </div>
    </main>

<script src="assets/js/functions.js"></script>
<script src="assets/js/masks.js"></script>

</body>
</html>
