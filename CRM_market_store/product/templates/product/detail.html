{% extends 'base.html' %}

{% block title %}
<title>{{ product.name }}</title>
{% endblock %}

{% block content %}
<table>
    <thead>
        <tr>
            <th>Product</th>
            <th>Category</th>
            <th>Code</th>
            <th>Price</th>
        </tr>
    </thead>

    <tbody>
            <tr>
                <td>{{ product.name }}</td>
                <td>
                    {% for category in product.categories.all %}
                        <span>{{ category }}</span>
                    {% endfor %}
                </td>
                <td>{{ product.code }}</td>
                <td>{{ product.price }}</td>
                <td>
                    <a href="{% url 'update_product' product.id %}">Update</a>
                    <a href="{% url 'delete_product' product.id %}">Delete</a>
                </td>
            </tr>
    </tbody>
</table>
{% endblock %}
