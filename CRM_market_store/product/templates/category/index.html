<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    table{
        border-collapse: collapse;
    }

    table, td, th {
        border: 2px solid black;
        padding: 10px;
    }
</style>
<body>
    <h1>Listar Categorias</h1>
    <button><a href="{% url 'create_product' %}">Criar produto</a></button>
    <button><a href="{% url 'index' %}">Listar produtos</a></button>
    <button><a href="{% url 'supplier_index' %}">Listar Fornecedores</a></button>
    <button><a href="{% url 'category_index' %}">Listar Categorias</a></button>
    <table>
        <thead>
            <tr>
                <th>Category</th>
                <th>Description</th>
            </tr>
        </thead>

        <tbody>
            {% for category in categories %}
                <tr>
                    <td>{{ category.name }}</td>
                    <td>
                        <a href="{% url 'category_detail' category.id %}">Detalhe</a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    
</body>
</html>
