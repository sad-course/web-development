{% extends 'base.html' %}

{% block title %}
<title>Categorias</title>
{% endblock %}
{% block content %}
<table>
    <thead>
        <tr>
            <th>Category</th>
            <th>Description</th>
        </tr>
    </thead>

    <tbody>
        {% for category in categories %}
            <tr>
                <td>{{ category.name }}</td>
                <td>
                    <a href="{% url 'category_detail' category.id %}">Detalhe</a>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
